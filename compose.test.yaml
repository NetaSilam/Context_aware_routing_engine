services:
  postgres:
    environment:
      POSTGRES_DB: road_risk_test
      POSTGRES_USER: road_risk_test
      POSTGRES_PASSWORD: test-only-password

  initialize:
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      FOUNDATION_DATA_MODE: fixture
      RISK_DATA_VERSION: test-risk-v1
      JWT_SECRET: test-only-secret-with-at-least-32-characters
      AUTH_ALLOWED_ORIGIN: http://localhost:5173
      OSRM_BASE_URL: http://fake-osrm:5000/normal/
      EXPECTED_OSRM_GRAPH_VERSION: test-osrm-graph-v1

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      JWT_SECRET: test-only-secret-with-at-least-32-characters
      AUTH_ALLOWED_ORIGIN: http://localhost:5173
      AUTH_COOKIE_SECURE: "false"
      LOGIN_RATE_LIMIT: "2"
      SIGNUP_RATE_LIMIT: "2"
      OSRM_BASE_URL: http://fake-osrm:5000/normal/
      EXPECTED_OSRM_GRAPH_VERSION: test-osrm-graph-v1
      ROUTE_JOB_STALE_CREATED_SECONDS: "2"

  worker:
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      JWT_SECRET: test-only-secret-with-at-least-32-characters
      AUTH_ALLOWED_ORIGIN: http://localhost:5173
      OSRM_BASE_URL: http://fake-osrm:5000/normal/
      EXPECTED_OSRM_GRAPH_VERSION: test-osrm-graph-v1
      TESTING: "true"
      ROUTE_JOB_LEASE_SECONDS: "12"
      ROUTE_JOB_MAX_RETRIES: "2"
      ROUTE_JOB_RETRY_BACKOFF_MAX_SECONDS: "2"
      CELERY_VISIBILITY_TIMEOUT_SECONDS: "15"
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: "8"
      CELERY_TASK_TIME_LIMIT_SECONDS: "10"
      ROUTE_WORKER_CONCURRENCY: "1"
    depends_on:
      fake-osrm:
        condition: service_healthy

  frontend:
    profiles: ["development-ui"]

  foundation-tests:
    build: ./backend
    command: ["pytest", "-q", "-m", "integration", "tests/test_foundation_stack.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      FOUNDATION_DATA_MODE: fixture
      FOUNDATION_FIXTURE_PATH: /app/tests/fixtures/foundation_fixture.sql
      FOUNDATION_TEST_API_URL: http://api:8000
      RUN_FOUNDATION_INTEGRATION: "true"
    depends_on:
      api:
        condition: service_healthy

  risk-data-tests:
    build: ./backend
    command: ["pytest", "-q", "-m", "integration", "tests/test_risk_data_stack.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      RISK_DATA_VERSION: test-risk-v1
      RISK_TEST_API_URL: http://api:8000
      RUN_RISK_DATA_INTEGRATION: "true"
    depends_on:
      api:
        condition: service_healthy

  corridor-matcher-tests:
    build: ./backend
    command: ["pytest", "-q", "-m", "integration", "tests/test_corridor_matcher_stack.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      RUN_CORRIDOR_MATCHER_INTEGRATION: "true"
    depends_on:
      initialize:
        condition: service_completed_successfully

  secure-auth-api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      JWT_SECRET: test-only-secret-with-at-least-32-characters
      AUTH_ALLOWED_ORIGIN: http://localhost:5173
      AUTH_COOKIE_SECURE: "true"
      OSRM_BASE_URL: http://fake-osrm:5000/normal/
      EXPECTED_OSRM_GRAPH_VERSION: test-osrm-graph-v1
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 1s
      timeout: 2s
      retries: 20

  auth-unavailable-api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://unavailable-redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      JWT_SECRET: test-only-secret-with-at-least-32-characters
      AUTH_ALLOWED_ORIGIN: http://localhost:5173
      AUTH_COOKIE_SECURE: "false"
      OSRM_BASE_URL: http://fake-osrm:5000/normal/
      EXPECTED_OSRM_GRAPH_VERSION: test-osrm-graph-v1
    depends_on:
      initialize:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 1s
      timeout: 2s
      retries: 20

  auth-tests:
    build: ./backend
    command: ["pytest", "-q", "-m", "integration", "tests/test_auth_stack.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      JWT_SECRET: test-only-secret-with-at-least-32-characters
      AUTH_ALLOWED_ORIGIN: http://localhost:5173
      AUTH_TEST_API_URL: http://api:8000
      AUTH_TEST_SECURE_API_URL: http://secure-auth-api:8000
      AUTH_TEST_UNAVAILABLE_API_URL: http://auth-unavailable-api:8000
      RUN_AUTH_INTEGRATION: "true"
    depends_on:
      api:
        condition: service_healthy
      secure-auth-api:
        condition: service_healthy
      auth-unavailable-api:
        condition: service_healthy

  fake-osrm:
    build: ./backend
    command: ["uvicorn", "tests.fake_osrm.app:app", "--host", "0.0.0.0", "--port", "5000"]
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 1s
      timeout: 2s
      retries: 20

  osrm-contract-tests:
    build: ./backend
    command: ["pytest", "-q", "-m", "integration", "tests/test_osrm_contract_stack.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      JWT_SECRET: test-only-secret-with-at-least-32-characters
      AUTH_ALLOWED_ORIGIN: http://localhost:5173
      OSRM_BASE_URL: http://fake-osrm:5000/normal/
      EXPECTED_OSRM_GRAPH_VERSION: test-osrm-graph-v1
      OSRM_CONTRACT_BASE_URL: http://fake-osrm:5000
      RUN_OSRM_CONTRACT_INTEGRATION: "true"
    depends_on:
      fake-osrm:
        condition: service_healthy

  route-job-tests:
    build: ./backend
    command: ["pytest", "-q", "-m", "integration", "tests/test_route_job_stack.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      JWT_SECRET: test-only-secret-with-at-least-32-characters
      AUTH_ALLOWED_ORIGIN: http://localhost:5173
      ROUTE_JOB_TEST_API_URL: http://api:8000
      RUN_ROUTE_JOB_INTEGRATION: "true"
      EXPECTED_OSRM_GRAPH_VERSION: test-osrm-graph-v1
      OSRM_BASE_URL: http://fake-osrm:5000/normal/
      TESTING: "true"
      ROUTE_JOB_STALE_CREATED_SECONDS: "2"
      QUEUE_UNAVAILABLE_API_URL: http://queue-unavailable-api:8000
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      queue-unavailable-api:
        condition: service_healthy

  queue-unavailable-api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://road_risk_test:test-only-password@postgres:5432/road_risk_test
      REDIS_URL: redis://unavailable-redis:6379/0
      FOUNDATION_DATA_VERSION: test-fixture-v1
      JWT_SECRET: test-only-secret-with-at-least-32-characters
      AUTH_ALLOWED_ORIGIN: http://localhost:5173
      OSRM_BASE_URL: http://fake-osrm:5000/normal/
      EXPECTED_OSRM_GRAPH_VERSION: test-osrm-graph-v1
      ROUTE_JOB_STALE_CREATED_SECONDS: "2"
    depends_on:
      initialize:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 1s
      timeout: 2s
      retries: 20
