server {
    listen 8080;
    server_name _;

    # Matches the app's own per-path ceiling (backend/app/main.py's RequestSizeLimitMiddleware):
    # 16KB for ordinary JSON bodies, but forum/DM media uploads are allowed up to
    # max(forum_media_max_image_bytes, forum_media_max_video_bytes) = 25MB. nginx has no
    # per-path body-size directive here, so this must cover the largest case; the app's own
    # middleware still enforces the tighter 16KB limit for everything else.
    client_max_body_size 30m;
    client_body_timeout 10s;
    send_timeout 15s;
    access_log off;
    error_log /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 65s;
        proxy_send_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
